<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warranty Management System</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
}


.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    text-align:center;
    transition:.3s;
}


.logo{

    font-size:55px;
    color:#2575fc;
    margin-bottom:15px;

}


h2{

    color:#222;
    margin-bottom:10px;

}


.subtitle{

    color:#666;
    font-size:14px;
    margin-bottom:25px;

}


.input-group{

    position:relative;

}


.input-group i{

    position:absolute;
    left:15px;
    top:15px;
    color:#777;

}


input{

    width:100%;
    padding:14px 14px 14px 45px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;

}


button{

    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2575fc;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;

}

input{
    width:100%;
    padding:14px 14px 14px 45px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    transition:.3s;
}

input:focus{
    outline:none;
    border-color:#2575fc;
    box-shadow:0 0 0 3px rgba(37,117,252,.15);
}

button:hover{
    background:#1d63d8;
}


button:disabled{

    opacity:.7;

}


.message{

    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;

}


.success{

background:#d4edda;
color:#155724;

}


.pending{

background:#fff3cd;
color:#856404;

}


.error{

background:#f8d7da;
color:#721c24;

}


.spinner{

display:none;
margin-top:15px;

}


.footer{

margin-top:20px;
font-size:12px;
color:#888;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">

<i class="fas fa-shield-alt"></i>

</div>


<h2>
Warranty Management System
</h2>


<p class="subtitle">
Enter provided details below to request access.
</p>



<div class="input-group">

<i class="fas fa-envelope"></i>

<input
id="email"
type="email"
placeholder="Enter your email">

</div>

<div class="input-group" style="margin-top:15px;">

    <i class="fas fa-map-marker-alt"></i>

    <select
        id="area"
        style="
            width:100%;
            padding:14px 14px 14px 45px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
            background:#fff;
            color:#555;
        "
    >
        <option value="">Select your Territory</option>
        <option value="Head Office">Head Office</option>
        <option value="Area 1">Area 1</option>
        <option value="Area 2">Area 2</option>
        <option value="Area 3">Area 3</option>
        <option value="Area 4">Area 4</option>
        <option value="Area 5">Area 5</option>
	<option value="SP-ARCTIC DAISY">SP-ARCTIC DAISY</option>
	<option value="SP-LBF">SP-LBF</option>
	<option value="SP-SGD">SP-SGD</option>
	<option value="SP-TPM">SP-TPM</option>
	<option value="SP-JMGC">SP-JMGC</option>
	<option value="SP-JZJZ">SP-JZJZ</option>
	<option value="SP-KOOLTRONIXS">SP-KOOLTRONIXS</option>
	<option value="SP-MECHANIKOOL">SP-MECHANIKOOL</option>
	<option value="SP-IRMS">SP-IRMS</option>
	<option value="SP-KERTECH">SP-KERTECH</option>
	<option value="SP-CGS">SP-CGS</option>
	<option value="SP-SGD NORTH LUZON">SP-SGD NORTH LUZON</option>
	<option value="SP-LCP">SP-LCP</option>
	<option value="COFFEE TEAM">COFFEE TEAM</option>
	<option value="HOTEL TEAM">HOTEL TEAM</option>
	<option value="LAUNDRY TEAM">LAUNDRY TEAM</option>
	<option value="IN-HOUSE TEAM">IN-HOUSE TEAM</option>
	<option value="INSTALLATION TEAM">INSTALLATION TEAM</option>
	<option value="CEBU-HO">CEBU-HO</option>
	<option value="CEBU-SP NSJ">CEBU-SP NSJ</option>
	<option value="CEBU-SP JEP">CEBU-SP JEP</option>
	<option value="CEBU-SP DCC">CEBU-SP DCC</option>
	<option value="CEBU-SP CMO">CEBU-SP CMO</option>
	<option value="CEBU-SP PURITY">CEBU-SP PURITY</option>
	<option value="DAVAO-HO">DAVAO-HO</option>
	<option value="DAVAO-SP LEACHIM">DAVAO-SP LEACHIM</option>
	<option value="DAVAO-SP KYTECH">DAVAO-SP KYTECH</option>
	<option value="DAVAO-SP JC KITCHEN">DAVAO-SP JC KITCHEN</option>

    </select>

</div>


<div class="input-group" style="margin-top:15px;">

    <i class="fas fa-user-tie"></i>

    <select
        id="position"
        style="
            width:100%;
            padding:14px 14px 14px 45px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
            background:#fff;
            color:#555;
        "
    >
        <option value="">Select your Position</option>
        <option value="Technician">Technician</option>
        <option value="Warranty Team">Warranty Team</option>
        <option value="Supervisor">Supervisor</option>
        <option value="Manager">Manager</option>
        <option value="Coordinator">Coordinator</option>
	<option value="Service Provider">Service Provider</option>
    </select>

</div>


<button 
id="loginBtn"
onclick="login()">

<i class="fas fa-sign-in-alt"></i>
Login

</button>



<div class="spinner" id="spinner">

<i class="fas fa-spinner fa-spin"></i>

</div>



<div id="msg" class="message"></div>



<div class="footer">

Access is subject to administrator approval.

</div>


</div>



<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbylT6fyrv0yj6n1HQxgS6v-4nlxg33aRLFc0bx0li5PkSM0c4OB_cxYGFqEGXRXdA/exec";


function showMessage(type, text) {

    const msg = document.getElementById("msg");

    msg.className = "message " + type;

    msg.style.display = "block";

    msg.innerHTML = text;

}


// =========================================
// AUTO-FILL SAVED INFORMATION
// =========================================

window.onload = function () {

    const savedEmail =
        localStorage.getItem("userEmail");

    const savedArea =
        localStorage.getItem("userArea");

    const savedPosition =
        localStorage.getItem("userPosition");


    if (savedEmail) {
        document.getElementById("email").value = savedEmail;
    }


    if (savedArea) {
        document.getElementById("area").value = savedArea;
    }


    if (savedPosition) {
        document.getElementById("position").value = savedPosition;
    }


    // Already logged in
    if (localStorage.getItem("loggedIn") === "true") {

        window.location.href = "home.html";

    }

};


// =========================================
// LOGIN
// =========================================

function login() {

    const email =
        document.getElementById("email").value.trim();


    const area =
        document.getElementById("area").value.trim();


    const position =
        document.getElementById("position").value.trim();


    // =========================================
    // VALIDATION
    // =========================================

    if (email === "") {

        showMessage(
            "error",
            "Please enter your email."
        );

        return;
    }


    if (area === "") {

        showMessage(
            "error",
            "Please select your Territory."
        );

        return;
    }


    if (position === "") {

        showMessage(
            "error",
            "Please select your Position."
        );

        return;
    }


    // =========================================
    // BUTTON / LOADING
    // =========================================

    const btn =
        document.getElementById("loginBtn");


    const spinner =
        document.getElementById("spinner");


    btn.disabled = true;

    spinner.style.display = "block";


    showMessage(
        "pending",
        "Checking your access..."
    );


    // =========================================
    // SEND REQUEST TO GOOGLE APPS SCRIPT
    // =========================================

    const url =
        WEBAPP_URL +
        "?email=" + encodeURIComponent(email) +
        "&area=" + encodeURIComponent(area) +
        "&position=" + encodeURIComponent(position) +
        "&t=" + Date.now();


    fetch(url, {
        method: "GET",
        redirect: "follow"
    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Server returned " + response.status
            );

        }

        return response.json();

    })


   .then(data => {

    console.log("Server response:", data);


    // =========================================
    // POSITION MISMATCH / BLOCKED
    // =========================================

    if (data.blocked === true) {

        // Make absolutely sure the user
        // cannot enter the system.
        localStorage.removeItem("loggedIn");


        showMessage(
            "error",
            data.message ||
            "Access denied. Your selected position does not match your registered position."
        );


        return;
    }


    // =========================================
    // OTHER SERVER ERROR
    // =========================================

    if (!data.success) {

        showMessage(
            "error",
            data.message ||
            "Unable to process your request."
        );


        return;
    }


    // =========================================
    // SAVE USER INFORMATION
    // =========================================

    localStorage.setItem(
        "userEmail",
        data.email
    );


    localStorage.setItem(
        "userArea",
        data.area || area
    );


    localStorage.setItem(
        "userPosition",
        data.position || position
    );


    // =========================================
    // APPROVED
    // =========================================

    if (data.approved === true) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );


        showMessage(
            "success",
            "Access approved. Redirecting..."
        );


        setTimeout(() => {

            window.location.href =
                "home.html";

        }, 1200);


    }

    // =========================================
    // PENDING
    // =========================================

    else {

        localStorage.removeItem(
            "loggedIn"
        );


        showMessage(
            "pending",
            "Your access request is pending approval."
        );

    }

})


    // =========================================
    // CONNECTION ERROR
    // =========================================

    .catch(error => {

        console.error(
            "Login error:",
            error
        );


        showMessage(
            "error",
            "Unable to connect to server. Please try again."
        );

    })


    // =========================================
    // FINISH LOADING
    // =========================================

    .finally(() => {

        btn.disabled = false;

        spinner.style.display = "none";

    });

}

</script>


</body>
</html>
